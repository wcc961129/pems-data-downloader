name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run pems-data profiles

  required:
    name: Required CI
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        run: test "${{ needs.test.result }}" = "success"
