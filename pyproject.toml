[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pems-data"
version = "0.2.0"
description = "Region- and time-scoped Caltrans PeMS Clearinghouse downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Chenchen Wei"},
]
keywords = [
  "Caltrans",
  "PeMS",
  "traffic data",
  "transportation research",
  "traffic state estimation",
  "GE-GAN",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "playwright>=1.45,<2",
  "requests>=2.31,<3",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
pems-data = "pems_data.cli:main"

[project.urls]
Homepage = "https://github.com/wcc961129/pems-data-downloader"
Documentation = "https://github.com/wcc961129/pems-data-downloader#readme"
Issues = "https://github.com/wcc961129/pems-data-downloader/issues"
"GE-GAN Paper" = "https://doi.org/10.1016/j.trc.2020.102635"
"GE-GAN Code" = "https://github.com/wcc961129/GE-GAN"

[tool.setuptools.packages.find]
include = ["pems_data*"]

[tool.uv]
required-version = ">=0.11,<0.12"
